#@TYPE: Machine
#@NAME: Nuvoton NuMaker IoT MA35D05KI1 Evaluation Board
#@DESCRIPTION: Machine configuration for Nuvoton NuMaker-IoT-MA35D05ki1 (256MB DDR, 512MB SPI NAND)

require conf/machine/include/ma35d05k.inc

KERNEL_DEVICETREE = "nuvoton/ma35d0-iot-ma35d05ki1-v1-256m.dtb"
KERNEL_IMAGETYPES = "Image"

# U-Boot configuration for SPI NAND boot (primary for BMC use case)
UBOOT_MACHINE = "ma35d0_spinand_defconfig"

# TF-A settings
TFA_PLATFORM = "ma35d1"
TFA_DTB = "ma35d05k-cpu650-custom-ddr"
TFA_DDR_HEADER = "MA35D05KI67C.h"
TFA_DDR_SIZE = "0x10000000"
TFA_SRCREV = "master"
TFA_PMIC = "0"
TFA_LOAD_CORE1 = "no"
TFA_LOAD_SCP = "no"

# OpenBMC features - suitable for a 512MB RAM system
IMAGE_FEATURES += "ssh-server-openssh"

OBMC_IMAGE_EXTRA_INSTALL:append = " packagegroup-ma35d05k-apps"

PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "packagegroup-ma35d05k-apps"
PREFERRED_PROVIDER_virtual/obmc-flash-mgmt = "packagegroup-ma35d05k-apps"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-ma35d05k-apps"

# Disable features not needed on this BMC platform
IMAGE_FEATURES:remove = " \
    obmc-host-ipmi \
    obmc-net-ipmi \
    obmc-ikvm \
    obmc-user-mgmt-ldap \
    obmc-telemetry \
"

IMAGE_INSTALL:remove = "rest-dbus"

DISTRO_FEATURES:append = " phosphor-no-ipmi-rmcp"
DISTROOVERRIDES:append = ":df-phosphor-no-ipmi-rmcp"

# Use systemd as init manager (standard for OpenBMC)
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

# Kernel image is raw Image for aarch64
FLASH_KERNEL_IMAGE = "Image-${MACHINE}.bin"
