#@TYPE: Machine
#@NAME: Nuvoton NuMaker IoT NUC980G2
#@DESCRIPTION: Machine configuration for Nuvoton NuMaker IoT NUC980G2 (64MB RAM, SPI NAND)

require conf/machine/include/nuc980.inc

UBOOT_MACHINE = "nuc980_iot_defconfig"
KERNEL_DEVICETREE = "nuvoton/nuc980-iot-128m-bmc.dtb"

# Minimal features for Redfish only
IMAGE_FEATURES += "ssh-server-openssh"

# Add our custom packagegroup for redfish
OBMC_IMAGE_EXTRA_INSTALL:append = " packagegroup-nuc980-apps"

# Disable features we don't need on a constrained 64MB system to speed up booting
IMAGE_FEATURES:remove = " \
    obmc-host-ipmi \
    obmc-net-ipmi \
    obmc-remote-logging-mgmt \
    obmc-software \
    obmc-ikvm \
    obmc-user-mgmt-ldap \
    obmc-telemetry \
    obmc-webui \
"
# Avoid compiling rest-dbus (legacy REST API)
IMAGE_INSTALL:remove = "rest-dbus"

# Disable IPMI PAM modules since we trimmed IPMI services
DISTRO_FEATURES:append = " phosphor-no-ipmi-rmcp phosphor-no-webui"
DISTROOVERRIDES:append = ":df-phosphor-no-ipmi-rmcp:df-phosphor-no-webui"



# Use systemd as init manager (standard for OpenBMC)
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

# GPIO-based power control via x86-power-control (PD12/PD13/PF9/PF10)
VIRTUAL-RUNTIME_obmc-host-state-manager = "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager = "x86-power-control"

# Tell image generation to use zImage instead of fitImage
FLASH_KERNEL_IMAGE = "zImage-${MACHINE}.bin"

KERNEL_IMAGETYPES = "zImage uImage"
UBOOT_ENTRYPOINT = "0x00008000"
UBOOT_LOADADDRESS = "0x00008000"
