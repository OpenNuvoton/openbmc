#@TYPE: Machine
#@NAME: Nuvoton NuMaker IoT MA35D16FJ87C Evaluation Board
#@DESCRIPTION: Machine configuration for Nuvoton NuMaker-IoT-MA35D16FJ87C (512MB DDR, 512MB SPI NAND)

require conf/machine/include/ma35-common.inc

MACHINEOVERRIDES .= ":ma35d1"

KERNEL_DEVICETREE = "nuvoton/ma35d1-iot-ma35d16fj0-v1-512m.dtb"
KERNEL_IMAGETYPES = "Image"

# U-Boot configuration for SPI NAND boot (primary for BMC use case)
UBOOT_MACHINE = "ma35d1_spinand_defconfig"

# NuWriter DDR init binary (in MA35D1_NuWriter/ddrimg/)
NUWRITER_DDR_IMG = "MA35D16FJ87C.bin"

# TF-A settings
TFA_PLATFORM = "ma35d1"
TFA_DTB = "ma35d1-cpu800-custom-ddr"
TFA_DDR_HEADER = "MA35D16FJ87C.h"
TFA_DDR_SIZE = "0x20000000"
TFA_SRCREV = "master"
TFA_PMIC = "0"
TFA_LOAD_CORE1 = "no"
TFA_LOAD_SCP = "no"

# Kernel settings
MA35_LOCALVERSION = "-ma35d1-openbmc"
MA35_DEFCONFIG = "ma35d1_bmc_defconfig"
MA35_DTS = "ma35d1-iot-ma35d16fj0-v1-512m-bmc.dts"
MA35_DTS_TARGET = "ma35d1-iot-ma35d16fj0-v1-512m.dts"
MA35_DTSI = "ma35d1.dtsi"

# OpenBMC features - suitable for a 512MB RAM system
IMAGE_FEATURES += "ssh-server-openssh"

OBMC_IMAGE_EXTRA_INSTALL:append = " packagegroup-ma35-apps"

PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "packagegroup-ma35-apps"
PREFERRED_PROVIDER_virtual/obmc-flash-mgmt = "packagegroup-ma35-apps"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-ma35-apps"

# Disable features not needed on this BMC platform
IMAGE_FEATURES:remove = " \
    obmc-host-ipmi \
    obmc-net-ipmi \
    obmc-ikvm \
    obmc-user-mgmt-ldap \
    obmc-telemetry \
"

IMAGE_INSTALL:remove = "rest-dbus"

DISTRO_FEATURES:append = " phosphor-no-ipmi-rmcp"
DISTROOVERRIDES:append = ":df-phosphor-no-ipmi-rmcp"

# Use systemd as init manager (standard for OpenBMC)
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

# GPIO-based power control via x86-power-control (PI12/PI10/PH2)
VIRTUAL-RUNTIME_obmc-host-state-manager = "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager = "x86-power-control"

# Kernel image is raw Image for aarch64
FLASH_KERNEL_IMAGE = "Image-${MACHINE}.bin"
