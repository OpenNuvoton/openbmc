name: OpenBMC building

on:
  # Manual dispatch with target machine selection
  workflow_dispatch:
    inputs:
      machine:
        description: 'Target machine'
        required: true
        default: 'all'
        type: choice
        options:
          - numaker-iot-nuc980g2
          - numaker-iot-ma35d0
          - numaker-iot-ma35d05ki1
          - all

  # Scheduled trigger (Every Sunday at 00:00 UTC)
  schedule:
    - cron: '0 0 * * 0'

# Single source of truth: maintain all target machines here (space-separated)
env:
  ALL_MACHINES: "numaker-iot-nuc980g2 numaker-iot-ma35d0 numaker-iot-ma35d05ki1"

jobs:
  # Dynamically build the matrix target list
  set-matrix:
    runs-on: self-hosted #ubuntu-latest
    outputs:
      machines: ${{ steps.select.outputs.machines }}
    steps:
      - id: select
        run: |
          # Check trigger event and user input
          SELECTED="${{ inputs.machine }}"
          
          # If triggered by schedule, "all" selected, or input is empty, build all machines
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$SELECTED" = "all" ] || [ -z "$SELECTED" ]; then
            # Convert space-separated string to JSON array: ["machine1", "machine2"]
            JSON_ARRAY=$(echo "$ALL_MACHINES" | jq -Rc 'split(" ")')
            echo "machines=$JSON_ARRAY" >> $GITHUB_OUTPUT
          else
            # Manual dispatch for a single machine
            echo "machines=[\"$SELECTED\"]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: set-matrix
    runs-on: self-hosted #ubuntu-latest
    strategy:
      fail-fast: false # Prevent failure in one machine from canceling other builds
      matrix:
        target_machine: ${{ fromJSON(needs.set-matrix.outputs.machines) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Yocto/Bitbake host dependencies
      - name: Install Required Packages
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo gcc-multilib build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils \
            debianutils iputils-ping python3-git python3-jinja2 libsdl1.2-dev \
            pylint xterm zstd lz4 jq

      - name: Cache Bitbake Downloads
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@v4
        with:
          path: build-numaker/downloads
          key: yocto-downloads-${{ matrix.target_machine }}-${{ github.ref_name }}
          restore-keys: |
            yocto-downloads-${{ matrix.target_machine }}-
            yocto-downloads-

      - name: Disable apparmor_restrict_unprivileged_userns
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Fetch package sources
        run: |
          MACHINE=${{ matrix.target_machine }} source setup ${{ matrix.target_machine }} build-numaker

          # Re-try
          MAX_RETRIES=100
          COUNT=0
          until bitbake nuwriter-pack --runall=fetch; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "::error::Bitbake fetch failed after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "Fetch encountered an error. Retrying ($COUNT/$MAX_RETRIES) in 15s..."
            sleep 30
          done

      - name: Build target image
        run: |
          # Source environment and execute actual build in the same step context
          MACHINE=${{ matrix.target_machine }} source setup ${{ matrix.target_machine }} build-numaker
          bitbake nuwriter-pack

      - name: Upload OpenBMC Images
        uses: actions/upload-artifact@v4
        with:
          name: openbmc-${{ matrix.target_machine }}
          path: |
            build-numaker/tmp/deploy/images/**/nuwriter-pack*.bin
            build-numaker/tmp/deploy/images/**/*.bat
          if-no-files-found: warn
