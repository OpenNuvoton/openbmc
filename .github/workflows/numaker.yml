name: OpenBMC building

on:
  workflow_dispatch:
    inputs:
      machine:
        description: 'Target machine'
        required: true
        default: 'numaker-iot-nuc980g2'
        type: choice
        options:
          - numaker-iot-nuc980g2
          - numaker-iot-ma35d0
          - numaker-iot-ma35d05ki1

jobs:
  build:
    runs-on: self-hosted

    # Setting bash as the default shell for all steps in this job
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v2

    # Yocto/Bitbake requires specific host packages. 
    # Uncomment this if your self-hosted runner isn't pre-configured.
    # - name: Install Required Packages
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc-multilib \
    #     build-essential chrpath socat cpio python3 python3-pip python3-pexpect \
    #     xz-utils debianutils iputils-ping python3-git python3-jinja2 libegl1-mesa \
    #     libsdl1.2-dev pylint xterm zstd lz4

    - name: Build
      run: |
        # OpenBMC/Yocto builds often need unprivileged user namespaces enabled 
        # (Uncomment the line below if you run into Bitbake sanity checker issues)
        # sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

        MACHINE=${{ github.event.inputs.machine }} source setup ${{ github.event.inputs.machine }} build-numaker

        # Prefetch sources to avoid mid-build download failures
        bitbake nuwriter-pack --runall=fetch
        
        # Execute the actual build
        bitbake nuwriter-pack

    - name: Upload OpenBMC Images
      uses: actions/upload-artifact@v4
      with:
        name: openbmc-${{ github.event.inputs.machine }}
        path: |
          build-numaker/tmp/deploy/images/**/nuwriter-pack*.bin
          build-numaker/tmp/deploy/images/**/*.bat
        if-no-files-found: warn
