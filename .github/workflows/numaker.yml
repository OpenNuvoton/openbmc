name: OpenBMC building

on:
  workflow_dispatch:
    inputs:
      machine:
        description: 'machine (nuc980,ma35d0,ma35d05k)'
        required: true
        default: 'nuc980'

jobs:
  build:
    runs-on: self-hosted

    # Setting bash as the default shell for all steps in this job
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v2

    # Yocto/Bitbake requires specific host packages. 
    # Uncomment this if your self-hosted runner isn't pre-configured.
    # - name: Install Required Packages
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc-multilib \
    #     build-essential chrpath socat cpio python3 python3-pip python3-pexpect \
    #     xz-utils debianutils iputils-ping python3-git python3-jinja2 libegl1-mesa \
    #     libsdl1.2-dev pylint xterm zstd lz4

    - name: Bulid
      run: |
        # OpenBMC/Yocto builds often need unprivileged user namespaces enabled 
        # (Uncomment the line below if you run into Bitbake sanity checker issues)
        # sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

        TEMPLATECONF=meta-numaker/meta-evb-${{github.event.inputs.machine}}/conf/templates/default source oe-init-build-env build-numaker

        # Prefetch sources to avoid mid-build download failures
        bitbake nuwriter-${{github.event.inputs.machine}}-pack --runall=fetch
        
        # Execute the actual build
        bitbake nuwriter-${{github.event.inputs.machine}}-pack

    - name: Upload OpenBMC Images
      uses: actions/upload-artifact@v4
      with:
        name: openbmc-${{ github.event.inputs.machine }}
        # Note: Depending on your exact target, you might want to narrow this path down 
        # to a specific machine folder inside /images/ to avoid bloating the artifact size.
        path: build-numaker/tmp/deploy/images/
        if-no-files-found: error
